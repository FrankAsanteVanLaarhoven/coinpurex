<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="prism" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="#070A0F"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#apexGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Geometric Prism / Apex Motif -->
  <polygon points="32,10 52,22 52,46 32,54 12,46 12,22" fill="url(#prism)" stroke="url(#apexGrad)" stroke-width="2"/>
  <polyline points="32,10 32,54" stroke="url(#apexGrad)" stroke-width="1.5" stroke-opacity="0.8"/>
  <polyline points="12,22 32,32 52,22" stroke="url(#apexGrad)" stroke-width="1.5" stroke-opacity="0.8"/>
  <polyline points="12,46 32,32 52,46" stroke="url(#apexGrad)" stroke-width="1.2" stroke-opacity="0.5"/>
</svg>
