<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0F"/>
      <stop offset="50%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Ambient Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="280" cy="315" r="220" fill="url(#glow)"/>

  <!-- Logo Motif -->
  <g transform="translate(160, 205) scale(3.2)">
    <polygon points="32,10 52,22 52,46 32,54 12,46 12,22" fill="#0A0F1D" stroke="#38BDF8" stroke-width="2"/>
    <polyline points="32,10 32,54" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
    <polyline points="12,22 32,32 52,22" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.8"/>
    <polyline points="12,46 32,32 52,46" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="440" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="64" fill="url(#gradText)" letter-spacing="2">APEX // PLATFORM</text>
  <text x="440" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="32" fill="#E2E8F0" letter-spacing="0.5">Sovereign DEX &amp; Multi-Sig Governance Treasury</text>
  <text x="440" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="22" fill="#94A3B8">High-performance on-chain order book • M-of-N consensus • Real-time telemetry • Apple precision</text>

  <!-- Institutional Badges -->
  <g transform="translate(440, 425)">
    <rect width="180" height="42" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38BDF8" stroke-width="1"/>
    <text x="90" y="27" font-family="monospace" font-size="15" fill="#38BDF8" text-anchor="middle" font-weight="700">SOLIDITY 0.8.20</text>
  </g>
  <g transform="translate(640, 425)">
    <rect width="190" height="42" rx="8" fill="rgba(99, 102, 241, 0.12)" stroke="#818CF8" stroke-width="1"/>
    <text x="95" y="27" font-family="monospace" font-size="15" fill="#818CF8" text-anchor="middle" font-weight="700">M-OF-N CONSENSUS</text>
  </g>
  <g transform="translate(850, 425)">
    <rect width="210" height="42" rx="8" fill="rgba(52, 211, 153, 0.12)" stroke="#34D399" stroke-width="1"/>
    <text x="105" y="27" font-family="monospace" font-size="15" fill="#34D399" text-anchor="middle" font-weight="700">ORDER BOOK ENGINE</text>
  </g>
</svg>
